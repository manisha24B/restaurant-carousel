    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Georgia, "Times New Roman", serif;
            background: #111;
            overflow-x: hidden;
        }


        /* =========================================
           HERO / CAROUSEL
        ========================================= */

        .carousel {
            position: relative;
            width: 100%;
            height: min(100vh, 820px);
            min-height: 520px;
            overflow: hidden;
            background: #111;
        }


        /* =========================================
           SLIDE
        ========================================= */

        .slide {
            position: absolute;
            inset: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            opacity: 0;

            transition:
                opacity 1.4s ease-in-out;

            pointer-events: none;
        }

        .slide.active {
            opacity: 1;
            pointer-events: auto;
        }


        /* =========================================
           IMAGE
        ========================================= */

        .slide img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: contain;
            object-position: center center;

            background: #111;

            transform: scale(1.02);

            transition:
                transform 6s ease;
        }

        .slide.active img {
            transform: scale(1.06);
        }


        /* =========================================
           DARK GRADIENT
        ========================================= */

        .slide::after {
            content: "";

            position: absolute;
            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,0.15) 0%,
                    rgba(0,0,0,0.05) 35%,
                    rgba(0,0,0,0.35) 70%,
                    rgba(0,0,0,0.72) 100%
                );
        }


        /* =========================================
           HERO CONTENT
           TEXT ONLY ON FIRST IMAGE
        ========================================= */

        .caption {
            position: absolute;

            z-index: 3;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            width: 92%;
            max-width: 1000px;

            text-align: center;

            color: white;
        }


        .caption h1 {
            font-size:
                clamp(44px, 7vw, 92px);

            font-weight: 500;

            letter-spacing: 3px;

            line-height: 1.05;

            margin-bottom: 18px;

            text-shadow:
                0 3px 10px rgba(0,0,0,0.8),
                0 5px 20px rgba(0,0,0,0.5);
        }


        .caption p {
            font-size:
                clamp(18px, 2.5vw, 30px);

            letter-spacing: 1px;

            line-height: 1.5;

            text-shadow:
                0 2px 8px rgba(0,0,0,0.8);
        }


        /* =========================================
           ARROWS
        ========================================= */

        .prev,
        .next {
            position: absolute;

            top: 50%;

            transform:
                translateY(-50%);

            z-index: 6;

            width: 50px;
            height: 50px;

            border: none;

            border-radius: 50%;

            background:
                rgba(0,0,0,0.35);

            color: white;

            font-size: 32px;

            cursor: pointer;

            display: flex;

            justify-content: center;
            align-items: center;

            transition:
                background 0.3s ease,
                transform 0.3s ease;
        }


        .prev:hover,
        .next:hover {
            background:
                rgba(0,0,0,0.75);

            transform:
                translateY(-50%)
                scale(1.08);
        }


        .prev {
            left: 25px;
        }

        .next {
            right: 25px;
        }


        /* =========================================
           DOTS
        ========================================= */

        .dots {
            position: absolute;

            z-index: 7;

            bottom: 24px;

            left: 50%;

            transform:
                translateX(-50%);

            display: flex;

            gap: 8px;

            padding: 7px 12px;

            border-radius: 20px;

            background:
                rgba(0,0,0,0.25);

            backdrop-filter:
                blur(5px);
        }


        .dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.55);

            cursor: pointer;

            transition:
                transform 0.25s ease,
                background 0.25s ease;
        }


        .dot.active {
            background: white;

            transform:
                scale(1.35);
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .carousel {
                height: 56.25vw;

                min-height: 330px;
                max-height: 600px;
            }

                object-fit: contain;

                transform: scale(1.03);
            }

                width: 90%;
            }


            .caption h1 {
                font-size:
                    clamp(30px, 9vw, 48px);

                letter-spacing: 1.5px;

                margin-bottom: 10px;
            }


            .caption p {
                font-size:

            }

                width: 36px;

        /* =========================================
           SMALL PHONES

            .carousel {

    <script>

        /* =========================================
           SLIDE CONTROL
        ========================================= */

        let currentSlide = 0;

        const slides =
            document.querySelectorAll(".slide");

        const dots =
            document.querySelectorAll(".dot");

        const carousel =
            document.getElementById("carousel");


        /* =========================================
           AUTOMATIC SLIDESHOW
        ========================================= */

        let autoSlideTimer;

        const slideDuration = 5000;


        function showSlide(index) {

            if (index >= slides.length) {

                currentSlide = 0;

            }

            else if (index < 0) {

                currentSlide =
                    slides.length - 1;

            }

            else {

                currentSlide = index;

            }


            slides.forEach(function(slide) {

                slide.classList.remove("active");

            });


            dots.forEach(function(dot) {

                dot.classList.remove("active");

            });


            slides[currentSlide]
                .classList.add("active");


            dots[currentSlide]
                .classList.add("active");

        }


        /* =========================================
           CHANGE SLIDE
        ========================================= */

        function changeSlide(direction) {

            showSlide(
                currentSlide + direction
            );

            restartAutoSlide();

        }


        /* =========================================
           DOT NAVIGATION
        ========================================= */

        function goToSlide(index) {

            showSlide(index);

            restartAutoSlide();

        }


        /* =========================================
           AUTO PLAY
        ========================================= */

        function startAutoSlide() {

            autoSlideTimer =
                setInterval(function() {

                    showSlide(
                        currentSlide + 1
                    );

                }, slideDuration);

        }


        function stopAutoSlide() {

            clearInterval(
                autoSlideTimer
            );

        }


        function restartAutoSlide() {

            stopAutoSlide();

            startAutoSlide();

        }


        /* =========================================
           PAUSE ON DESKTOP HOVER
        ========================================= */

        carousel.addEventListener(
            "mouseenter",
            function() {

                stopAutoSlide();

            }
        );


        carousel.addEventListener(
            "mouseleave",
            function() {

                startAutoSlide();

            }
        );


        /* =========================================
           MOBILE SWIPE
        ========================================= */

        let touchStartX = 0;

        let touchEndX = 0;


        carousel.addEventListener(
            "touchstart",
            function(event) {

                touchStartX =
                    event.changedTouches[0].screenX;

            },
            { passive: true }
        );


        carousel.addEventListener(
            "touchend",
            function(event) {

                touchEndX =
                    event.changedTouches[0].screenX;

                handleSwipe();

            },
            { passive: true }
        );


        function handleSwipe() {

            const distance =
                touchEndX - touchStartX;


            if (Math.abs(distance) < 50) {

                return;

            }


            if (distance < 0) {

                changeSlide(1);

            }

            else {

                changeSlide(-1);

            }

        }


        /* =========================================
           START SLIDESHOW
        ========================================= */

        startAutoSlide();

    </script>
